mutation createAttachment($input: _CreateAttachmentInput!, $changeId: String!, $contractId: ID!, $change: _CreateAttachmentChangeInput!) { packet { createAttachment(input: $input) { id attachmentId logicalAttachmentId documentId fileName contentType size storageReference version current uploadedAt } createAttachmentChange(input: $change) { id } updatePdsContract(input: { id: $contractId, attachmentsHead: $changeId }) { id } } }
